name: Supabase keep-alive
# 무료 Supabase는 7일 동안 접속이 없으면 일시정지됩니다.
# 2일마다 DB에 가벼운 요청을 보내 마니또 기간 중에 사이트가 멈추지 않게 합니다.
on:
  schedule:
    - cron: '17 3 */2 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /tmp/out.txt -w '%{http_code}' -X POST \
            'https://avozjsmiulwkwvrqzyar.supabase.co/rest/v1/rpc/my_view' \
            -H 'apikey: sb_publishable_MpTayqhKYFYUIpEay6SxfQ_Lym7XYZH' \
            -H 'Content-Type: application/json' \
            -d '{"p_token":"keepalive"}')
          cat /tmp/out.txt; echo
          # INVALID_LINK(400)이 정상 응답: DB까지 요청이 도달했다는 뜻
          grep -q INVALID_LINK /tmp/out.txt
